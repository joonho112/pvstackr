# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The optional backends are not installed here (see the dependency step),
      # so the check must not treat their absence as an error.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # cmdstanr is a Suggests dependency and lives outside CRAN; the
          # DESCRIPTION Additional_repositories field is not consulted by the
          # dependency solver, so the repository is declared here as well.
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Install the hard dependencies only. The optional Bayesian backends
          # in Suggests pull rstan, a heavy source build, and the package is
          # designed to install, load, and test without them: the backend and
          # oracle tests skip when they are absent. testthat is requested
          # explicitly because the tests need it.
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # The package ships pre-built vignettes (inst/doc) and reference fixtures
          # whose content hashes are validated in the reference environment; it is
          # checked with --no-build-vignettes by design (see dev/02_check.R). Mirror
          # that here: do not rebuild vignettes and do not re-run examples on a fresh
          # machine. Environment-sensitive fixture-parity tests are opt-in
          # (PVSTACKR_RUN_HASH_TESTS), so they skip on CI.
          build_args: 'c("--no-manual","--no-build-vignettes")'
          args: 'c("--no-manual","--ignore-vignettes","--no-examples")'
