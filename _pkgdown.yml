url: https://joonho112.github.io/pvstackr

template:
  bootstrap: 5
  bootswatch: cosmo
  math-rendering: mathjax
  bslib:
    primary: "#1f6f9c"
    info: "#f2c14e"

development:
  mode: auto

navbar:
  structure:
    left: [getstarted, reference, articles, news]
    right: [search, github]
  components:
    getstarted:
      text: Get started
      href: articles/a1-getting-started.html
    articles:
      text: Articles
      menu:
        - text: Applied articles
        - text: "Getting started with pvstackr"
          href: articles/a1-getting-started.html
        - text: "The full analysis workflow"
          href: articles/a2-the-workflow.html
        - text: "Reading and reporting the results"
          href: articles/a3-reading-results.html
        - text: "Comparing the three fitting methods"
          href: articles/a4-comparing-methods.html
        - text: "Real PISA data: access, memory and reproducibility"
          href: articles/a5-real-pisa-guidance.html
        - text: "---"
        - text: Method articles
        - text: "Plausible values, survey weights and notation"
          href: articles/m1-foundations-and-notation.html
        - text: "The design-based target: BRR–Fay replicate weights and Rubin's rules"
          href: articles/m2-brr-fay-target.html
        - text: "One stacked fit and the Rubin point estimate"
          href: articles/m3-stacked-bridge.html
        - text: "Calibrating the fixed-effect draws (CCC)"
          href: articles/m4-ccc-calibration.html
        - text: "Choosing a method and reading its intervals"
          href: articles/m5-methods-and-coverage.html

reference:
  - title: Package overview
    desc: >
      What pvstackr computes, and the objects that its functions return.
    contents:
      - pvstackr-package
      - pvstackr_object_contracts

  - title: Check the columns
    desc: >
      Find and check the plausible-value, final-weight and replicate-weight
      columns of a PISA-style data set.
    contents:
      - pv_design
      - detect_pisa_pv_columns
      - detect_pisa_brr_replicate_weights

  - title: Compute the target
    desc: >
      Compute the design-based target for the fixed effects from the BRR-Fay
      replicate weights and Rubin's rules, and check or rebuild a saved target.
    contents:
      - pv_brr_target
      - pv_revalidate_brr_target

  - title: Fit a model
    desc: >
      `pv_fit()`, the functions for the three methods, and their settings.
    contents:
      - pv_fit
      - pv_fit_direct
      - pv_fit_reference
      - pv_fit_stack_psis
      - pv_control

  - title: Fitting engine
    desc: >
      The fitting functions of the bundled brms engine, which you can reuse
      when you supply fitting functions of your own.
    contents:
      - pv_backend_brms_fit_function

  - title: Compare methods
    desc: >
      Put fits made with different methods side by side, with agreement
      diagnostics.
    contents:
      - pv_compare_methods

  - title: Read results
    desc: >
      Read the estimate table, the target, the draws and the diagnostics of a
      fit.
    contents:
      - get_estimates
      - get_target
      - get_draws
      - get_diagnostics

  - title: Print and summary
    desc: >
      Print methods for all pvstackr objects, and summary methods for fits and
      comparisons.
    contents:
      - pvstackr_fit_summary
      - pvstackr_method_comparison_summary

  - title: Earlier versions
    desc: >
      Read `stack_psis` fits saved by an earlier version of pvstackr.
    contents:
      - pv_migrate_legacy_psis_fit

articles:
  - title: Applied articles
    navbar: ~
    desc: >
      How to run an analysis on your own data, and how to read and report its
      result.
    contents:
      - a1-getting-started
      - a2-the-workflow
      - a3-reading-results
      - a4-comparing-methods
      - a5-real-pisa-guidance

  - title: Method articles
    navbar: ~
    desc: >
      The formulas behind pvstackr, their sources, and the assumptions under
      which they hold.
    contents:
      - m1-foundations-and-notation
      - m2-brr-fay-target
      - m3-stacked-bridge
      - m4-ccc-calibration
      - m5-methods-and-coverage

authors:
  JoonHo Lee:
    href: https://github.com/joonho112

footer:
  structure:
    left: developed_by
    right: built_with
